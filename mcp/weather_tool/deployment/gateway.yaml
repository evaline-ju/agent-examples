# MCP Gateway registration for the weather tool.
#
# Apply AFTER the weather tool is deployed (via UI or kubectl):
#   kubectl apply -f mcp/weather_tool/deployment/gateway.yaml
#
# The gateway controller retries until the tool is reachable, so ordering
# doesn't matter — it will pick up the tool once the Service has endpoints.
#
# NOTE: The backendRefs port below must match the weather-tool-mcp Service port.
# The Kagenti UI defaults to 9090; the k8s.yaml manifest uses 8000.
# Check with: kubectl get svc weather-tool-mcp -n team1 -o jsonpath='{.spec.ports[0].port}'
#
# Agents that should route through the gateway need their MCP_URL updated to:
#   http://mcp-gateway-istio.gateway-system.svc.cluster.local:8080/mcp
---
# Route traffic from the MCP Gateway to the weather tool service.
# The mcp-server: "true" label is required for gateway discovery.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: weather-tool-route
  namespace: team1
  labels:
    mcp-server: "true"
spec:
  parentRefs:
  - name: mcp-gateway
    namespace: gateway-system
  hostnames:
  - "weather-tool.mcp.local"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: weather-tool-mcp
      port: 9090
---
# Register the weather tool with the MCP Gateway broker.
apiVersion: mcp.kuadrant.io/v1alpha1
kind: MCPServerRegistration
metadata:
  name: weather-tool-servers
  namespace: team1
spec:
  toolPrefix: weather_
  targetRef:
    group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: weather-tool-route
    namespace: team1
